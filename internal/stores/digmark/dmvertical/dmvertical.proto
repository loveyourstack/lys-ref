syntax = "proto3";

option go_package = "github.com/loveyourstack/lys-ref/cmd/rpcsrv/pb";

package pb;

import "google/protobuf/timestamp.proto";

message DmVerticalInput {
  string name = 1;
}

/* Note: Input columns are repeated in model message below.
 * An embedded message is allowed, but in reponse, embedded message can't be flattened, so repetition is preferred.
 *
 * Note: In response, int64 is marshaled to string to avoid precision loss in clients which can't represent int64 properly.
 * Note2: In response, timestamps are converted to UTC.
 *
 * Currently not generating these files. The field numbers must not change once in production, so some manual intervention might be needed.
*/
message DmVertical {
  int64 id = 1;
  int64 campaign_count = 2; // use int64 for Go int
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
  
  string name = 5;
}