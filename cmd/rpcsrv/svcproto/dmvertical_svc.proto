syntax = "proto3";

option go_package = "github.com/loveyourstack/lys-ref/cmd/rpcsrv/pb";

package pb;

import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";

import "cmd/rpcsrv/svcproto/common.proto";
import "internal/stores/digmark/dmvertical/dmvertical.proto";

message ListVerticalsResponse { repeated DmVertical items = 1; }
message UpdateVerticalRequest {
  int64 id = 1;
  DmVerticalInput input = 2;
  google.protobuf.FieldMask field_mask = 3;
}

service VerticalService {
  rpc List(ListRequest)              returns (ListVerticalsResponse);
  rpc Get(GetByIdRequest)            returns (DmVertical);
  rpc Create(DmVerticalInput)        returns (DmVertical);
  rpc Update(UpdateVerticalRequest)  returns (DmVertical);   // id + DmVerticalInput + field_mask
  rpc Delete(DeleteByIdRequest)      returns (google.protobuf.Empty);
}