syntax = "proto3";

option go_package = "github.com/loveyourstack/lys-ref/cmd/rpcsrv/pb";

package pb;

import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";

import "cmd/rpcsrv/svcproto/common.proto";
import "internal/stores/digmark/dmcampaign/dmcampaign.proto";

message ListCampaignsResponse { repeated DmCampaign items = 1; }
message UpdateCampaignRequest {
  int64 id = 1;
  DmCampaignInput input = 2;
  google.protobuf.FieldMask field_mask = 3;
}

service CampaignService {
  rpc List(ListRequest)              returns (ListCampaignsResponse);
  rpc Get(GetByIdRequest)            returns (DmCampaign);
  rpc Create(DmCampaignInput)        returns (DmCampaign);
  rpc Update(UpdateCampaignRequest)  returns (DmCampaign);   // id + DmCampaignInput + field_mask
  rpc Delete(DeleteByIdRequest)      returns (google.protobuf.Empty);
}