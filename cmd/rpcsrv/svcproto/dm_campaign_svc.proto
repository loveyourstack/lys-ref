syntax = "proto3";

option go_package = "github.com/loveyourstack/lys-ref/cmd/rpcsrv/pb";

package pb;

import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";

import "cmd/rpcsrv/svcproto/common.proto";
import "internal/stores/digmark/dmcampaign/dmcampaign.proto";

message ListDmCampaignsResp { 
  repeated DmCampaign   data = 1;
  optional GetMetadata  metadata = 2;
}

message UpdateDmCampaignReq {
  int64                     id = 1;
  DmCampaignInput           input = 2;
  google.protobuf.FieldMask field_mask = 3;
}

service DmCampaignSvc {
  rpc List(ListReq)                 returns (ListDmCampaignsResp);
  rpc Get(GetByIdReq)               returns (DmCampaign);
  rpc Create(DmCampaignInput)       returns (DmCampaign);
  rpc Update(UpdateDmCampaignReq)   returns (DmCampaign);   // id + DmCampaignInput + field_mask
  rpc Delete(DeleteByIdReq)         returns (google.protobuf.Empty);
}