syntax = "proto3";

option go_package = "github.com/loveyourstack/lys-ref/cmd/refrpcsrv/pb";

package pb;

import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";

import "internal/stores/digmark/dmcampaign/dmcampaign.proto";

message ListCampaignsRequest {}
message ListCampaignsResponse { repeated DmCampaign items = 1; }
message GetCampaignRequest { int64 id = 1; }
message CreateCampaignRequest { DmCampaignInput input = 1; }
message UpdateCampaignRequest {
  int64 id = 1;
  DmCampaignInput input = 2;
  google.protobuf.FieldMask field_mask = 3;
}
message DeleteCampaignRequest { int64 id = 1; }

service CampaignService {
  rpc List(ListCampaignsRequest)     returns (ListCampaignsResponse);
  rpc Get(GetCampaignRequest)        returns (DmCampaign);
  rpc Create(CreateCampaignRequest)  returns (DmCampaign);   // body = DmCampaignInput
  rpc Update(UpdateCampaignRequest)  returns (DmCampaign);   // id + DmCampaignInput + field_mask
  rpc Delete(DeleteCampaignRequest)  returns (google.protobuf.Empty);
}